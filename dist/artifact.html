<title>All Cohol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
:root{
  --bg:#F5F3F7;--surface:#FFFFFF;--ink:#221A2B;--muted:#6B6177;--line:#E3DDE9;
  --accent:#A8234A;--accent-ink:#FFFFFF;--accent-soft:#F6E3EA;
  --ok:#3A722A;--ok-soft:#E5F0DF;--warn:#8F570A;--warn-soft:#F7ECDA;
  --field:#8F859B;--photo-bg:#FFFFFF;--shadow:0 1px 2px rgba(34,26,43,.06),0 6px 20px rgba(34,26,43,.06);--shadow-up:0 -4px 20px rgba(34,26,43,.08);
  --display:"Secular One","Assistant",Arial,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#151119;--surface:#1F1925;--ink:#EFE9F3;--muted:#A69BB2;--line:#342B3D;--field:#75697F;--photo-bg:#EDE9F0;
    --accent:#F06C90;--accent-ink:#1A0F14;--accent-soft:#3A1C27;
    --ok:#8CC77A;--ok-soft:#1F2D1B;--warn:#E0A955;--warn-soft:#33260F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-up:0 -4px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151119;--surface:#1F1925;--ink:#EFE9F3;--muted:#A69BB2;--line:#342B3D;--field:#75697F;--photo-bg:#EDE9F0;
  --accent:#F06C90;--accent-ink:#1A0F14;--accent-soft:#3A1C27;
  --ok:#8CC77A;--ok-soft:#1F2D1B;--warn:#E0A955;--warn-soft:#33260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-up:0 -4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em}
h1 .accent{color:var(--accent)}
.tagline{color:var(--muted);margin:0;font-size:15px}
.top-main{display:grid;gap:4px;min-width:0}
h1{white-space:nowrap}
.lang-btn{font:600 13px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.lang-btn:hover{border-color:var(--accent)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
.tabs{display:flex;max-width:520px;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px var(--body);padding:9px 10px;border-radius:999px;cursor:pointer;position:relative}
.tabs svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.tabs button:not([aria-selected="true"]):hover{background:var(--accent-soft)}}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[hidden]{display:none}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tab-d{display:none}
  .app:not([data-view="bar"]) #pane-bar{display:none}
  .app:not([data-view="mix"]) #pane-mix{display:none}
}
.pane h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 4px}
.pane .sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner button{font:600 13px var(--body);border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 12px;cursor:pointer}
.search{display:flex;gap:8px;margin-bottom:14px}
input[type="search"],input[type="text"]{width:100%;font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:10px 12px}
:is(input,select,textarea,button,a,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:is(input,select,textarea):focus{border-color:var(--accent)}
.btn,.chip,.bchip,.buy a,.buy button,.tabs button,.bcard,.photo-cta,.ob-res{transition:background .15s,border-color .15s,color .15s,transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
:is(.btn,.chip,.bchip,.bcard,.photo-cta,.ob-res,.buy a,.buy button):active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.bchip:hover{border-color:var(--accent)}
.cat{margin-top:14px}
.cat:first-of-type{margin-top:0}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cat-h h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cat-h small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{content:"✓";font-size:12px}
.chip .x{opacity:.7;font-size:13px}
.custom-add{display:flex;gap:8px;margin-top:10px}
.btn{font:700 14px var(--body);border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.note a{color:inherit}
.count{font-variant-numeric:tabular-nums}

.mood{display:grid;gap:14px;margin-bottom:18px}
.lbl{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .chip[aria-pressed="true"]::before{content:none}
.mood-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.results-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px}
.results-h h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
.results-h small{color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.drink{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.drink.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.drink-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.drink h4{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.drink .alt{color:var(--muted);font-size:13px;text-align:start}
[dir="rtl"] .drink .alt{text-align:right}
.meter{display:flex;gap:3px;align-items:center;flex-shrink:0;padding-top:4px}
.meter b{width:7px;height:16px;border-radius:2px;background:var(--line)}
.meter b.f{background:var(--accent)}
.meter span{font-size:12px;color:var(--muted);margin-inline-start:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:1px 8px}
.missing{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:4px 8px}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
.drink details{margin-top:auto;border-top:1px solid var(--line);padding-top:4px}
.drink details summary{display:flex;align-items:center;min-height:36px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"◂ ";display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(-90deg)}
[dir="ltr"] details summary::before{content:"▸ "}
[dir="ltr"] details[open] summary::before{transform:rotate(90deg)}
.ings{list-style:none;padding:0;margin:8px 0 6px;display:grid;gap:3px;font-size:14px}
.ings li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.ings li .amt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ings li.have .nm::before{content:"✓ ";color:var(--ok)}
.ings li.no .nm{color:var(--warn)}
.ings li.no .nm::before{content:"✗ "}
.ings .optl{color:var(--muted);font-size:12px}
.method{font-size:14px;margin:0}
.glass{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.bottles{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.bottles.top{margin:0 0 16px;padding:0 0 16px;border-top:0;border-bottom:1px solid var(--line)}
.chips-title{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.bottles>h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.bottles>p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.brow{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:0}
.brow-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brow-h b{font-size:15px}
select{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:7px 10px;max-width:100%}
.bchip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bchip small{color:var(--muted);font-weight:400}
.bchip .x{opacity:.6}
.bform{display:flex;gap:6px;flex-wrap:wrap}
.bform input{flex:1 1 150px;width:auto;padding:7px 10px;font-size:15px}
.bform .btn{padding:7px 14px}
.chip .n{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.chip.bottle{border-style:dashed}
.with-hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.fit{font-size:13px;border-radius:8px;padding:5px 8px;background:var(--bg);border:1px solid var(--line)}
.fit b{font-weight:700}
.fit.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.fit.bad{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.fit .tip{display:block;color:var(--ink);opacity:.85;margin-top:2px}
.ings li .bn{color:var(--muted);font-weight:600}
.app:not([data-view="shop"]) #pane-shop{display:none}
@media (min-width:861px){.tab-m{display:none}.app[data-view="shop"] .grid{display:none}}
.shop-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:14px}
.shop-controls label{display:grid;gap:4px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.suggest{margin-bottom:16px}
.suggest .chip small{font-weight:400;opacity:.85}
.shop-filters{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:6px}
.shop-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.bottle-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.bottle-card h4{margin:0;font-size:18px}
.bottle-card .style{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price strong{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent);direction:ltr}
.price small{color:var(--muted);font-size:12px}
.goodfor{font-size:13px}
.goodfor b{font-weight:700}
.owned{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.buy{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.buy a,.buy button{font:600 13px var(--body);text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.buy a:hover,.buy button:hover{border-color:var(--accent)}
.buy .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.disclaimer{font-size:12px;color:var(--muted);margin:14px 0 0;max-width:70ch}
.missing button{font:700 12px var(--body);background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0 4px}
.app:not([data-view="menu"]) #pane-menu{display:none}
@media (min-width:861px){.app[data-view="menu"] .grid{display:none}}
/* phones: bottom tab bar, compact header, bigger tap targets, scrolling chip rows */
.jump{display:none}
@media (max-width:860px){
  .app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  header.top{flex-wrap:nowrap;margin-bottom:12px}
  .tagline{display:none}
  .tabs{position:fixed;top:auto;bottom:0;inset-inline:0;max-width:none;margin:0;gap:4px;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-up);z-index:20}
  .tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:6px 2px;border-radius:12px;font-size:12.5px;line-height:1.2}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .tabs svg{display:block}
  .tabs .tab-d{display:none}
  .tabs .count{position:absolute;top:1px;inset-inline-end:calc(50% - 36px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}
  .tabs .count:empty{display:none}
  html{scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .chip{min-height:40px}
  .chips,.seg{gap:8px}
  .bchip{min-height:36px}
  .ob-skip{min-height:44px;padding:8px 12px}
  .jump{display:inline-block}
  #typeSeg,#styleSeg,#suggestSeg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
  [dir="ltr"] :is(#typeSeg,#styleSeg,#suggestSeg){-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
  #typeSeg::-webkit-scrollbar,#styleSeg::-webkit-scrollbar,#suggestSeg::-webkit-scrollbar{display:none}
  #typeSeg .chip,#styleSeg .chip,#suggestSeg .chip{flex:none;white-space:nowrap}
}
@media (max-width:860px) and (max-height:500px){
  .tabs button{flex-direction:row;gap:6px;min-height:44px}
  .tabs .count{position:static}
  .app{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
.menu-top{display:grid;gap:12px}
.photo-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photo-row[hidden]{display:none}
.photo-row input[type="file"]{font:14px var(--body);color:var(--ink);max-width:100%}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}
#bottleRows>.status{margin:6px 0 0}
#bottleRows>.status:empty{min-height:0;margin:0}
.summary{background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:4px;margin:16px 0 4px}
.summary b{color:var(--ok)}
.summary.plain{background:var(--surface);border:1px solid var(--line)}
.wines{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.wine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow);position:relative}
.wine.best{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft),var(--shadow)}
.wine .badge{position:absolute;top:-10px;inset-inline-start:12px;background:var(--ok);color:var(--surface);font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.wine-name{display:flex;gap:6px}
.wine-name input{font-weight:700}
.wine-name button{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:0 6px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1.3fr);gap:6px}
.fields label>div{display:grid;grid-template-columns:minmax(52px,1fr) auto;gap:4px}
.fields label:last-child>div{grid-template-columns:1fr 1fr}
.fields select{flex:none;width:66px;min-width:66px}
.fields input{min-width:0}
.fields label{display:grid;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.fields input{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:8px;padding:7px 8px;width:100%;font-variant-numeric:tabular-nums}
.wine .meta{font-size:12px;color:var(--muted)}
.stats{display:grid;gap:4px;font-size:14px}
.stats .row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.stats .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vwrap{display:flex;flex-wrap:wrap;gap:6px}
.verdict{font-size:13px;font-weight:700;border-radius:8px;padding:4px 8px}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.mid{background:var(--accent-soft);color:var(--ink)}
.verdict.bad{background:var(--warn-soft);color:var(--warn)}
.paste{margin-top:10px}
.paste summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.paste textarea{width:100%;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--field);border-radius:10px;padding:10px;margin:8px 0;resize:vertical}
.menu-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.menu-actions[hidden]{display:none}
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob-in{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:grid;gap:16px}
#obBody{display:grid;gap:14px}
.ob-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ob-steps{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ob-steps i{width:26px;height:5px;border-radius:3px;background:var(--line);display:inline-block}
.ob-steps i.on{background:var(--accent)}
.ob-skip{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:6px}
.ob h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.ob .lead{margin:0;color:var(--muted)}
.counter{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:2}
.counter .big{font-family:var(--display);font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:center}
.counter .big.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.counter .txt{display:grid;gap:2px;font-size:14px}
.counter .txt b{font-size:16px}
.counter .txt span{color:var(--muted);font-size:13px}
.ob-results{display:grid;gap:6px}
.ob-res{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;font:15px var(--body);color:var(--ink);text-align:start}
.ob-res:hover{border-color:var(--accent)}
.ob-res small{color:var(--muted)}
.ob-res .plus{font-weight:700;color:var(--accent);white-space:nowrap}
.ob-res>span:not(.thumb):not(.plus){flex:1;min-width:0}
.ob-res .thumb{flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:56px}
.ob-res .thumb svg{display:block;width:26px;height:52px}
.ob-res .thumb.photo{background:var(--photo-bg);border-radius:6px;overflow:hidden}
.ob-res .thumb img{display:block;width:100%;height:100%;object-fit:contain}
.unlock{border-radius:14px;padding:12px 14px;background:var(--ok-soft);color:var(--ink);display:grid;gap:4px;animation:pop .35s ease}
.unlock b{color:var(--ok)}
.unlock.none{background:var(--surface);border:1px dashed var(--line)}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.added{display:flex;flex-wrap:wrap;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));grid-auto-flow:row dense;gap:8px}
.tile{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;min-height:64px;padding:10px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:600 15px var(--body);line-height:1.25;text-align:center;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;inset-inline-start:9px;color:var(--accent);font-weight:700}
.tile .thumb{display:block;width:22px;height:44px}
.type-card{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:10px 12px 12px}
.tc-head{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);font:700 16px var(--body);cursor:pointer;text-align:start;min-height:44px}
.tc-head .thumb{display:block;width:18px;height:36px;flex:none}.tc-head .thumb svg{display:block;width:100%;height:100%}
.tc-head .nm::before{content:"✓ ";color:var(--accent)}
.tc-head .x{margin-inline-start:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:20px}
.tc-head:hover .x{background:var(--surface);color:var(--ink)}
.tc-hint{margin:0;color:var(--muted);font-size:13px}
.type-card .brow-scroll{margin-inline:-12px;padding-inline:12px}
.ob-find{width:100%;font:16px var(--body);padding:12px 14px;border:1px solid var(--field);border-radius:12px;background:var(--surface);color:var(--ink)}
.tile .thumb svg{display:block;width:100%;height:100%}
.tile .plus{font-size:12px;color:var(--ok);font-weight:700}
.chip.done{cursor:default}
.ob-type{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ob-type h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.brow-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.brow-scroll::-webkit-scrollbar{display:none}
.bcard{flex:none;scroll-snap-align:start;position:relative;width:96px;display:grid;justify-items:center;align-content:start;gap:6px;padding:10px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:600 12.5px var(--body);line-height:1.25;text-align:center;cursor:pointer}
.bcard .thumb{display:flex;align-items:center;justify-content:center;width:56px;height:76px}
.bcard .thumb.photo{background:var(--photo-bg);border-radius:8px;overflow:hidden}
.bcard .thumb img{width:100%;height:100%;object-fit:contain}
.bcard .thumb svg{width:30px;height:60px}
.bcard .nm{direction:ltr;overflow-wrap:anywhere}
.bcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bcard[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;inset-inline-start:8px;color:var(--accent);font-weight:700}
.bcard.other{border-style:dashed;justify-content:center;align-content:center;color:var(--accent)}
.bcard.other .plus-ic{display:grid;place-items:center;width:56px;height:76px;font-size:28px;font-weight:400}
.bcard.other .nm{direction:inherit}
@media (hover:hover){.bcard:hover{border-color:var(--accent)}}
.photo-cta{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1.5px solid var(--accent);border-radius:16px;background:var(--accent-soft);color:var(--ink);font:15px var(--body);text-align:start;cursor:pointer}
.photo-cta .ic svg{display:block;width:32px;height:32px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.photo-cta b{display:block;font-weight:700}
.photo-cta small{color:var(--muted);font-size:13px}
.photo-cta:disabled{opacity:.6;cursor:progress}
.ob-foot{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:51}
.ob-foot-in{max-width:600px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.ob-foot .btn{padding:12px 22px;font-size:16px}
.chip .plus{font-size:11px;color:var(--ok);font-weight:700}
.chip[aria-pressed="true"] .plus{color:inherit}
.reopen{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.counter .big.bump,.unlock{animation:none}}
</style>

<script>/* Claude prompts and output schemas, shared by the claude.ai artifact (sent through the
   `sample` capability) and the web server function (api/claude.js). Each task takes plain
   params and returns {prompt, schema, tier, effort}. Loaded as a classic script in the
   page (sets window.HB_PROMPTS) and with require() on the server. */
(function(root){
  const num={type:["number","null"]};
  const obj=(props)=>({type:"object",properties:props,required:Object.keys(props),additionalProperties:false});
  const list=(item)=>obj({items:{type:"array",items:item}});
  // The language the user reads the app in; short notes come back in it. Defaults to Hebrew.
  const language=p=>p.lang==="en"?"English":"Hebrew";

  const MENU_ITEM=obj({name:{type:"string"},kind:{type:"string",enum:["wine","spirit"]},glass:num,bottle:num,retail_low:num,retail_high:num,note:{type:"string"}});
  const WINE_HIT=obj({name:{type:"string"},he_name:{type:"string"},kind:{type:"string",enum:["red","white","rose","sparkling","other"]},note:{type:"string"},retail_low:num,retail_high:num,confidence:{type:"string",enum:["high","medium","low"]}});
  const BOTTLE_HIT=obj({id:{type:"string"},name:{type:"string"},style:{type:"string"},il_low:num,il_high:num,us_low:num,us_high:num});
  const PHOTO_HIT=obj({id:{type:"string"},name:{type:["string","null"]},style:{type:["string","null"]}});

  function menuPrompt(extra,p){
    return "You help a diner in a restaurant judge a drinks menu. "+extra+
      "\nFor each item estimate the typical retail shop price of one bottle (750 ml for wine, 700 ml for spirits) in "+p.country+" in "+p.currency+
      ", as retail_low and retail_high numbers, or null if you cannot identify the wine well enough. Be realistic; do not guess wildly."+
      "\nReturn ONLY JSON: {\"items\":[{\"name\":string,\"kind\":\"wine\"|\"spirit\",\"glass\":number|null,\"bottle\":number|null,\"retail_low\":number|null,\"retail_high\":number|null,\"note\":string}]}"+
      "\n`note` is a very short description in "+language(p)+" (grape, region, vintage), e.g. \"Cabernet Sauvignon, Upper Galilee, 2021\". Keep names as printed on the menu.";
  }
  const EXTRACT="Extract every wine, and any spirit sold by the glass, with its glass price and bottle price as printed (numbers only, null if missing). Skip food.";

  const TASKS={
    // Every task also takes p.lang ("he" | "en"), the language for notes.
    // p: {country, currency}; one image attached
    menu_photo:p=>({tier:"default",effort:"medium",schema:list(MENU_ITEM),images:true,
      prompt:menuPrompt("The attached image is a photo of a restaurant menu. "+EXTRACT,p)}),
    // p: {country, currency, text}
    menu_text:p=>({tier:"default",effort:"medium",schema:list(MENU_ITEM),
      prompt:menuPrompt("Below is text copied from a restaurant menu (it may be messy OCR). "+EXTRACT+"\n---\n"+String(p.text||"").slice(0,12000)+"\n---",p)}),
    // p: {country, currency, lines: "name | glass | bottle" per line}
    menu_estimate:p=>({tier:"default",effort:"medium",schema:list(MENU_ITEM),
      prompt:menuPrompt("Here are items from a restaurant menu (name | glass price | bottle price):\n"+String(p.lines||"").slice(0,8000)+"\nReturn them in the same order with the same names and prices.",p)}),
    // p: {country, currency, q}
    wine_search:p=>({tier:"complex",effort:"high",schema:list(WINE_HIT),
      prompt:"You are a wine expert helping a diner in "+p.country+" who is looking at a restaurant wine list. They typed: \""+String(p.q||"").slice(0,200)+"\"."+
      "\nThe text is probably Hebrew and may be a winery name, a label, a grape, or a phrase like 'the red of <winery>'. First work out what it refers to: translate or transliterate Hebrew winery names (examples: סוסון ים = Sea Horse Winery, כרם שבו = Shvo Vineyards, לוינסון = Lewinsohn, צרעה = Tzora, ספרה = Sphera, גבעות = Gvaot, נטופה = Netofa, בת שלמה = Bat Shlomo). Israeli boutique wineries are very likely."+
      "\nIf a winery is named with a color or style, list that winery's actual wines of that color. If only a winery is named, list its best-known wines. Only list wines you believe really exist; mark confidence."+
      "\nFor each give: name (English), he_name (as written on Israeli menus, in Hebrew), kind (red, white, rose, sparkling or other), note (very short, in "+language(p)+": color, grapes, region), and the typical retail shop price of a 750 ml bottle in "+p.country+" in "+p.currency+" as retail_low and retail_high (null if you don't know). Up to 5 wines, most likely first."+
      "\nReturn ONLY JSON: {\"items\":[{\"name\":string,\"he_name\":string,\"kind\":\"red\"|\"white\"|\"rose\"|\"sparkling\"|\"other\",\"note\":string,\"retail_low\":number|null,\"retail_high\":number|null,\"confidence\":\"high\"|\"medium\"|\"low\"}]}"}),
    // p: {q, catalog, styles}
    bottle_identify:p=>({tier:"complex",effort:"high",schema:list(BOTTLE_HIT),
      prompt:"Someone in Israel is listing the bottles they have at home and typed: \""+String(p.q||"").slice(0,200)+"\". It may be Hebrew (transliterate brand names, e.g. וודפורד = Woodford, סוסון ים = Sea Horse Winery), a typo, a partial name, or a wine; Israeli brands and wineries are likely."+
      "\nIdentify up to 3 real products it most likely means, most likely first. Map each to one catalog id (lines are 'id = display name'):\n"+p.catalog+
      "\nFor spirits pick the closest style key for that id:\n"+p.styles+"\nFor other ids use style \"std\"."+
      "\nAlso estimate the typical shelf price range: il_low/il_high in ILS for 700 ml in Israel, us_low/us_high in USD for 750 ml in the US (null if not sold there)."+
      "\nReturn ONLY JSON: {\"items\":[{\"id\":string,\"name\":string,\"style\":string,\"il_low\":number|null,\"il_high\":number|null,\"us_low\":number|null,\"us_high\":number|null}]}. name = the official product name in Latin letters. Empty list if nothing fits."}),
    // p: {catalog, styles}; one image attached
    bottle_photo:p=>({tier:"default",effort:"medium",schema:list(PHOTO_HIT),images:true,
      prompt:"The attached photo shows one or more bottles or drink ingredients at someone's home. Identify each one and map it to this catalog (lines are 'id = display name'):\n"+p.catalog+
      "\n\nFor spirits, also give the brand/product name as printed on the label (in Latin letters if the label uses them) and pick the closest style key for that id:\n"+p.styles+
      "\n\nReturn ONLY JSON: {\"items\":[{\"id\":catalog id,\"name\":string|null,\"style\":style key|null}]}. Use only ids from the catalog; skip anything that does not fit. Empty list if you see no bottles."})
  };
  if(typeof module!=="undefined"&&module.exports)module.exports=TASKS;
  else root.HB_PROMPTS=TASKS;
})(typeof window!=="undefined"?window:globalThis);
</script>

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];let best=i;
    for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));best=Math.min(best,cur[j])}
    if(best>max)return max+1;prev=cur;
  }
  return prev[b.length];
}
// How well one typed token matches one indexed token: 3 exact, 2 prefix, 1 fuzzy, 0 none.
function tokScore(q,t){
  if(q===t)return 3;
  if(t.startsWith(q)&&q.length>=2)return 2.2;
  const heb=/[\u05d0-\u05ea]/.test(q);
  if(q.length>=(heb?5:4)&&t.startsWith(q.slice(0,-1)))return 1.6;
  const max=heb?(q.length>=7?2:q.length>=5?1:0):(q.length>=6?2:q.length>=4?1:0);
  if(!max)return 0;
  if(lev(q,t,max)<=max)return 1.2;
  if(t.length>q.length&&lev(q,t.slice(0,q.length),1)<=1)return 1;
  return 0;
}
/* Build an index over entries: each entry gets a token list from the given text fields. */
function makeIndex(entries,fields){return entries.map(e=>({e,t:[...new Set(fields(e).flatMap(toks))]}))}
function searchIndex(index,q,limit=8){
  const STOP=new Set(["של","יין","יינות","יקב","בקבוק","את","עם","the","of","wine","winery","bottle","a"].map(normText));
  let qt=toks(q).filter(x=>!STOP.has(x));if(!qt.length)qt=toks(q);if(!qt.length)return [];
  // Hebrew prefix letters: "הירדן" → "ירדן", "ושבו" → "שבו"
  const alts=qt.map(x=>{const a=[x,HE2EN[x]];if(/^[הובלמכש][\u05d0-\u05ea]{2,}$/.test(x)){const y=x.slice(1);a.push(y,HE2EN[y])}return a.filter(Boolean)});
  const run=allowMiss=>{
    const out=[];
    index.forEach(({e,t})=>{
      let total=0,miss=0;
      for(const opts of alts){
        let best=0;for(const o of opts)for(const tt of t){const s=tokScore(o,tt);if(s>best)best=s;if(best===3)break}
        if(!best){if(++miss>allowMiss)return}
        total+=best;
      }
      out.push({e,score:total-miss*2-(e.name||"").length*0.01});
    });
    return out.sort((a,b)=>b.score-a.score).slice(0,limit).map(x=>x.e);
  };
  let res=run(0);
  if(!res.length&&qt.length>=2)res=run(1);
  return res;
}

let uidN=0;const uid=()=>"b"+Date.now().toString(36)+(uidN++).toString(36);
const LS_KEY="homebar.v1";
let state=clean(loadLocal())||{items:[],custom:[],bottles:[],learned:[]};

let db=null,docRef=null,saveTimer=null,lastRemote="";

function clean(d){
  if(!d||typeof d!=="object")return null;
  // Earlier versions started from a sample bar; a bar still in that state starts empty.
  const sample=!!d.example;
  return {
    items:!sample&&Array.isArray(d.items)?d.items.filter(x=>CAT_OF[x]):[],
    custom:!sample&&Array.isArray(d.custom)?d.custom.map(String).slice(0,100):[],
    bottles:!sample&&Array.isArray(d.bottles)?d.bottles.filter(b=>b&&STYLES[b.type]&&STYLES[b.type][b.style]&&b.name).map(b=>({id:String(b.id||uid()),type:b.type,name:String(b.name).slice(0,60),style:b.style})):[],
    learned:Array.isArray(d.learned)?d.learned.filter(l=>l&&l.name&&STYLES[l.type]&&STYLES[l.type][l.style]).slice(0,200).map(l=>({name:String(l.name).slice(0,70),type:l.type,style:l.style,il:Array.isArray(l.il)?l.il.slice(0,2):[null,null],us:Array.isArray(l.us)?l.us.slice(0,2):[null,null]})):[]
  };
}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function have(){return new Set(state.items)}
function barEmpty(){return !state.items.length&&!state.custom.length&&!state.bottles.length}
function payloadKey(s){return JSON.stringify({items:s.items,custom:s.custom,bottles:s.bottles,learned:s.learned||[]})}

function commit(){
  saveLocal();render();
  if(docRef){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const payload={items:state.items,custom:state.custom,bottles:state.bottles,learned:state.learned||[],updatedAt:Date.now()};
      lastRemote=payloadKey(payload);
      docRef.set(payload).then(()=>setSync(true,"sync.account")).catch(()=>setSync(false,"sync.failed"));
    },500);
  }
}

/* ---------- matching ---------- */
const ids=spec=>spec.split("|");
function hasAny(spec,H){return ids(spec).some(id=>H.has(id)||(EQUIV[id]||[]).some(e=>H.has(e)))}
function analyze(d,H){const miss=[];d.i.forEach(([spec,,opt])=>{if(!opt&&!hasAny(spec,H))miss.push(spec)});return miss}
function uses(d,id){return d.i.some(([spec])=>ids(spec).includes(id)||ids(spec).some(x=>(EQUIV[x]||[]).includes(id)))}
function tasteScore(d){return mood.tastes.filter(t=>d.t.includes(t)).length}
function selectedBottle(){const w=mood.withs.find(k=>k.startsWith("b:"));return w?state.bottles.find(b=>b.id===w.slice(2)):null}
function fitsMood(d){
  if(mood.strength&&d.s!==mood.strength)return false;
  if(mood.tastes.length&&tasteScore(d)===0)return false;
  return mood.withs.every(k=>{
    const [kind,val]=[k.slice(0,1),k.slice(2)];
    if(kind==="i")return uses(d,val);
    if(kind==="g"){const g=GROUPS.find(x=>x.key===val);return g&&g.ids.some(id=>uses(d,id))}
    if(kind==="b"){const b=state.bottles.find(x=>x.id===val);return b&&uses(d,b.type)}
    return true;
  });
}
function styleOf(b){return STYLES[b.type][b.style]}
function bottleScore(d,b){
  const t=styleOf(b).t,f=d.f||{};
  return 2*(f.g||[]).filter(x=>t.includes(x)).length-3*(f.b||[]).filter(x=>t.includes(x)).length;
}
/* For each ingredient line, the user's best bottle for it (respecting a chosen bottle). */
function bottlePicks(d){
  const sel=selectedBottle(),picks={};
  d.i.forEach(([spec],idx)=>{
    let cands=state.bottles.filter(b=>ids(spec).includes(b.type));
    if(sel&&cands.includes(sel))cands=[sel];
    if(!cands.length)return;
    const scored=cands.map(b=>({b,score:idx===0?bottleScore(d,b):0})).sort((a,b)=>b.score-a.score);
    picks[idx]=scored[0];
  });
  return picks;
}
function fitScore(d){const p=bottlePicks(d)[0];return p&&d.f?p.score:0}
function specName(spec){return ids(spec).map(id=>NAME[id]).join(" / ")}
function fmtAmt(a){return typeof a==="number"?a+" "+t("unit.ml"):L.amount[a]||a}

/* ---------- render helpers ---------- */
const $=id=>document.getElementById(id);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}
  kids.flat().forEach(k=>{if(k!=null&&k!==false)e.append(k.nodeType?k:document.createTextNode(k))});
  return e;
}

/* ---------- inventory ---------- */
function renderInventory(){
  const H=have(),box=$("inventory");box.innerHTML="";
  const q=filterText.trim();
  CATS.forEach(c=>{
    const items=c.items.filter(([id,n])=>!q||n.toLowerCase().includes(q.toLowerCase())||id.includes(q.toLowerCase()));
    if(!items.length)return;
    const n=c.items.filter(([id])=>H.has(id)).length;
    box.append(el("div",{class:"cat"},
      el("div",{class:"cat-h"},el("h3",{},c.name),el("small",{},n+" / "+c.items.length)),
      el("div",{class:"chips"},items.map(([id,name])=>{
        const bc=state.bottles.filter(b=>b.type===id).length;
        return el("button",{type:"button",class:"chip","aria-pressed":String(H.has(id)),onclick:()=>toggle(id)},name,bc?el("span",{class:"n"},"· "+bc):null);
      }))
    ));
  });
  if(!box.children.length)box.append(el("p",{class:"note"},t("bar.notFound")));
  const cc=$("customChips");cc.innerHTML="";
  state.custom.forEach((name,idx)=>cc.append(el("button",{type:"button",class:"chip","aria-pressed":"true","aria-label":t("common.removeX",name),onclick:()=>{state.custom.splice(idx,1);commit()}},name,el("span",{class:"x"},"✕"))));
  $("clearWrap").hidden=barEmpty();
  const nItems=state.items.length+state.custom.length;
  $("tabCount").textContent=nItems||"";
  $("tabCount").parentElement.setAttribute("aria-label",t("tab.barAria",nItems));
  renderBottles();
}

function toggle(id){
  const i=state.items.indexOf(id);
  if(i>=0){
    state.items.splice(i,1);
    const gone=new Set(state.bottles.filter(b=>b.type===id).map(b=>"b:"+b.id));
    state.bottles=state.bottles.filter(b=>b.type!==id);
    mood.withs=mood.withs.filter(k=>k!=="i:"+id&&!gone.has(k));
  }else state.items.push(id);
  commit();
}

let bottleQ="",bottleManual=null;
function addToBar(e){
  if(e.custom){bottleManual=e.custom;renderBottles();return}
  const before=makeableCount();
  if(!state.items.includes(e.id))state.items.push(e.id);
  if(e.name&&STYLES[e.id]&&STYLES[e.id][e.style]&&!state.bottles.some(b=>b.type===e.id&&b.name===e.name))state.bottles.push({id:uid(),type:e.id,name:e.name,style:e.style});
  bottleQ="";bottleManual=null;finder.ai=null;commit();
  const d=makeableCount()-before;
  const s=$("bottleStatus");if(s)s.textContent=t("bar.added",e.name||NAME[e.id],d);
}
function makeableCount(){const H=have();return DRINKS.filter(d=>!analyze(d,H).length).length}
function renderBottles(){
  const box=$("bottleRows");box.innerHTML="";
  const inp=el("input",{type:"search",id:"bottleSearch",placeholder:t("bar.searchPh"),autocomplete:"off",value:bottleQ});
  const res=el("div",{class:"ob-results",style:"margin-top:8px"});
  inp.addEventListener("input",()=>{bottleQ=inp.value;finder(res,bottleQ,addToBar)});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const f=res.querySelector(".ob-res");if(f)f.click()}});
  box.append(inp,res,el("p",{class:"status",id:"bottleStatus"}));
  if(bottleQ)finder(res,bottleQ,addToBar);
  if(bottleManual!=null)box.append(manualForm(bottleManual,e=>{if(e)addToBar(e);else{bottleManual=null;renderBottles()}}));
  const types=[...new Set(state.bottles.map(b=>b.type))];
  types.forEach(type=>{
    const mine=state.bottles.filter(b=>b.type===type);
    box.append(el("div",{class:"brow"},el("div",{class:"brow-h"},el("b",{},NAME[type])),
      el("div",{class:"chips"},mine.map(b=>el("button",{type:"button",class:"bchip","aria-label":t("common.removeX",b.name),title:t("common.remove"),onclick:()=>{
        state.bottles=state.bottles.filter(x=>x.id!==b.id);mood.withs=mood.withs.filter(k=>k!=="b:"+b.id);commit();
      }},b.name,styleOf(b).n?el("small",{},styleOf(b).n):null,el("span",{class:"x"},"✕"))))));
  });
  if(!types.length)box.append(el("p",{class:"note"},t("bar.noBottles")));
}


/* ---------- mood ---------- */
function renderMood(){
  const ss=$("strengthSeg");ss.innerHTML="";

    if(p.score<0){cls+=" bad";verdict=t("drink.fitBad",bad.map(x=>NOTE[x]).join(", "))}

function calc(it){
  const isSpirit=it.kind==="spirit";
  const size=it.size||(isSpirit?700:750);            // restaurant bottle size, ml
  const rsize=isSpirit?700:750;                      // shop price is for this size
  const portion=isSpirit?50:pour;
  const perBottle=size/portion;                      // pours in the restaurant bottle
  const r={perBottle,size,rsize};
  if(it.glass&&it.bottle){r.glassEq=it.bottle/perBottle;r.save=1-r.glassEq/it.glass;r.breakEven=Math.ceil(it.bottle/it.glass-1e-9)}
  const mid=it.rl&&it.rh?(it.rl+it.rh)/2:(it.rl||it.rh||null);
  if(mid){
    r.mid=mid;const perMl=mid/rsize;
    if(it.bottle)r.mB=it.bottle/(perMl*size);        // same volume in the shop
    if(it.glass)r.mG=it.glass/(perMl*portion);        // one pour vs the same pour from a shop bottle
  }
  r.score=r.mB??r.mG??null;                          // lower = better deal
  return r;
}
function verdict(m){
  if(m==null)return null;
  if(m<=2)return ["good",t("menu.fair")];

}

  if(withScore.length)return {by:"markup",...withScore.sort((a,b)=>a.c.score-b.c.score)[0]};
  const withEq=menu.items.map(it=>({it,c:calc(it)})).filter(x=>x.c.glassEq!=null||x.it.bottle);
  if(!withEq.length)return null;
  withEq.sort((a,b)=>(a.c.glassEq??a.it.bottle/a.c.perBottle)-(b.c.glassEq??b.it.bottle/b.c.perBottle));
  return {by:"price",...withEq[0]};
}

function sampleError(e){

// Re-encode to JPEG (max 1600 px) so iPhone HEIC photos and huge files are accepted.
async function prepImage(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
    return blob||file;
  }catch(e){return file}
}

let itemIdx=null,itemIdxKey="";
function learnedProducts(){return (state.learned||[]).map(l=>({name:l.name,brand:"",he:l.he||"",type:l.type,style:l.style,il:l.il||[null,null],us:l.us||[null,null],learned:true}))}
function itemIndex(){
  const key=(state.learned||[]).length+":"+Object.keys(NAME).length;
  if(itemIdx&&key===itemIdxKey)return itemIdx;
  // Names in both languages are indexed, so either finds the item whatever the UI language.
  const both=id=>[LOCALES.he.item[id],LOCALES.en.item[id]];
  const types=Object.keys(CAT_OF).map(id=>({kind:"type",id}));
  // Wines from the wine list can be kept at home too; map each to red, white or bubbles.
  const wineType=n=>{const k=wineKind(n);return k==="rose"?"white_wine":k};
  const seen=new Set(PRODUCTS.map(p=>p.name.toLowerCase()));
  const wines=WINE_LIST.filter(w=>!seen.has(w.name.toLowerCase())).map(w=>({name:w.name,he:w.he,type:wineType(w.note),style:"std",il:w.il,us:[null,null],note:null,wineNote:w.note}));
  const prods=PRODUCTS.concat(wines,learnedProducts()).map(p=>({kind:"product",...p}));
  itemIdx=makeIndex(types.concat(prods),e=>e.kind==="type"?[...both(e.id),e.id.replace(/_/g," ")]:[e.name,e.he,...both(e.type)]);
  itemIdxKey=key;return itemIdx;
}
// Bottle size in ml for a catalog product: a size in the data wins; wines are 750, spirits 700.
function sizeOf(p){
  if(typeof p.note==="number")return p.note;

}
const sizeLabel=ml=>ml>=1000?(ml/1000)+" "+t("unit.l"):ml+" "+t("unit.ml");

function priceWithSize(cur,lo,hi,ml){
  if(!lo)return null;

  return ltr(cur+lo+(hi&&hi!==lo?"–"+hi:""))+" "+t("size.for",sizeLabel(ml))+(ml!==1000?" · ≈"+ltr(cur+perL)+" "+t("size.perL"):"");
}

/* Renders results for query q into box. onPick(entry) gets {id,name?,style?} or {custom}. */
function finder(box,q,onPick,opts={}){

function makeable(){const H=have();return DRINKS.filter(d=>!analyze(d,H).length).map(d=>d.name)}

  const H=have();let best=null;
  Object.keys(NAME).forEach(id=>{if(H.has(id)||(exclude&&exclude.has(id)))return;const n=unlockCount(id);if(n&&(!best||n>best.n))best={id,n}});
  return best;

// "Within reach": cocktails whose bottles (spirits, liqueurs, wine) are all there, before asking about the
// kitchen. It keeps the first screens from showing 0 when only juice or lemon is missing.
const BOTTLE_CATS=new Set(["spirit","liqueur","wine"]);
function reachable(H=have()){
  return DRINKS.filter(d=>{
    const need=d.i.filter(([spec,,opt])=>!opt&&ids(spec).some(id=>BOTTLE_CATS.has(CAT_OF[id])));
    return need.length&&need.every(([spec])=>hasAny(spec,H));
  }).length;
}
function reachGain(id){const H=have();if(H.has(id))return 0;const H2=new Set(H);H2.add(id);return reachable(H2)-reachable(H)}

// Add through onboarding. With rerender=false the caller updates the screen itself.
function obAdd(entries,rerender=true){
  const before=new Set(makeable());
  entries.forEach(e=>{
    if(!state.items.includes(e.id))state.items.push(e.id);
    if(e.name&&STYLES[e.id]&&STYLES[e.id][e.style]&&!state.bottles.some(b=>b.type===e.id&&b.name===e.name))
      state.bottles.push({id:uid(),type:e.id,name:e.name,style:e.style});
  });
  commit();
  ob.last={unlocked:makeable().filter(n=>!before.has(n))};
  ob.q="";ob.notice="";finder.ai=null;
  if(rerender)renderOb(true);
}
function obRemoveItem(id){if(state.items.includes(id))toggle(id);ob.last=null;renderOb()}

const typesOf=(...cats)=>CATS.filter(c=>cats.includes(c.id)).flatMap(c=>c.items.map(([id])=>id));

 {key:"spirits",ids:()=>typesOf("spirit","liqueur"),pick:true,photo:true,next:"ob.next.wine"},

    el("b",{},reach?t("ob.counterReach",n):t("ob.counterNow",n)),el("span",{},line)));

// A tappable bottle card. Updates itself in place so the row keeps its scroll position.
function bottleCard(type,name,style){
  const mine=()=>state.bottles.find(b=>b.type===type&&b.name===name);

  const row=el("div",{class:"brow-scroll"},own.map(b=>bottleCard(type,b.name,b.style)),listed.slice(0,12).map(p=>bottleCard(type,p[0],p[1])),
    el("button",{type:"button",class:"bcard other","aria-expanded":String(ob.qType===type),onclick:()=>{ob.qType=ob.qType===type?null:type;ob.q="";renderOb();const i=$("obSearch");if(i)i.focus()}},

    inp.addEventListener("input",()=>{ob.q=inp.value;draw()});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const f=res.querySelector(".ob-res");if(f)f.click()}});
    draw();sec.append(inp,res);
    if(ob.manual!=null)sec.append(manualForm(ob.manual,e=>{ob.manual=null;if(e){ob.qType=null;obAdd([e])}else renderOb()}));
  }
  return sec;

// Steps 1–2: search, photo, then the types; a chosen type opens in place to pick bottles.
function pickStep(body,S){
  const list=S.ids(),types=new Set(list);
  const inp=el("input",{type:"search",id:"obFind",class:"ob-find",placeholder:t("ob."+S.key+"Ph"),autocomplete:"off",value:ob.qType?"":ob.q,"aria-label":t("ob."+S.key+"Ph")});
  const res=el("div",{class:"ob-results"});
  const draw=()=>finder(res,inp.value,e=>{if(e.custom){ob.manual=e.custom;renderOb()}else{inp.value="";obAdd([e])}},{types});
  inp.addEventListener("input",()=>{ob.qType=null;ob.q=inp.value;draw()});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const f=res.querySelector(".ob-res");if(f)f.click()}});
  if(!ob.qType)draw();

    const file=el("input",{type:"file",id:"obPhoto",accept:"image/*",capture:"environment",hidden:""});
    file.addEventListener("change",()=>{if(file.files[0])obIdentify(file.files[0])});
    const btn=el("button",{type:"button",class:"photo-cta",onclick:()=>file.click(),disabled:ob.busy?"":null},el("span",{class:"ic"}),
      el("span",{},el("b",{},t("ob.photoBtn")),el("small",{},ob.busy?t("ob.photoBusy"):t("ob.photoSub"))));
    btn.querySelector(".ic").innerHTML=ICON_CAM;

function obGo(step){ob.step=step;ob.last=null;ob.q="";ob.qType=null;ob.manual=null;ob.notice="";renderOb();$("ob").scrollTop=0}
function renderOb(bump){
  const y=$("ob").scrollTop;
  stepsEl();
  const body=$("obBody"),foot=$("obFoot");body.innerHTML="";foot.innerHTML="";
  if(ob.step===0){
    body.append(el("h2",{id:"obTitle"},t("ob.introTitle")),el("p",{class:"lead"},t("ob.introLead")));
    foot.append(el("button",{class:"btn ghost",type:"button",onclick:closeOb},t("common.later")),el("button",{class:"btn",type:"button",onclick:()=>obGo(1)},t("ob.start")));

  if(S){
    body.append(el("h2",{id:"obTitle"},t("ob."+S.key+"Title")),el("p",{class:"lead"},t("ob."+S.key+"Lead")),counterEl(bump,S.pick));
    if(S.pick)pickStep(body,S);

    foot.append(el("button",{class:"btn ghost",type:"button",onclick:()=>ob.step===1?closeOb():obGo(ob.step-1)},ob.step===1?t("common.later"):t("common.back")),
      el("button",{class:"btn",type:"button",onclick:()=>obGo(ob.step+1)},t(S.next)));
    $("ob").scrollTop=y;

  }
  // Last screen: what the bar can make now.
  const names=makeable(),nx=bestNext();
  body.append(el("h2",{id:"obTitle"},t("ob.doneTitle",names.length)),
    el("p",{class:"lead"},names.length?t("ob.doneLead"):t("ob.doneLeadNone")),
    names.length?el("div",{class:"chips"},names.slice(0,10).map(n=>el("span",{class:"chip done"},n))):null,
    nx?el("div",{class:"unlock none"},el("div",{},...(()=>{const [a,x,b]=t("ob.doneBest",NAME[nx.id],nx.n);return [a,el("b",{},x),b]})())):null);
  foot.append(el("button",{class:"btn ghost",type:"button",onclick:()=>obGo(OB_STEPS.length)},t("common.back")),
    el("button",{class:"btn",type:"button",onclick:finishOb},names.length?t("ob.go"):t("ob.toBar")));
}
async function obIdentify(file){
  if(!sampleApi||ob.busy)return;
  ob.busy=true;ob.notice="";renderOb();
  const catalog=Object.entries(NAME).map(([id,n])=>id+" = "+n).join("\n");
  const styles=Object.entries(STYLES).map(([ty,ss])=>ty+": "+Object.entries(ss).map(([k,v])=>k+" ("+v.t.join("/")+")").join(", ")).join("\n");
  try{
    const res=await sampleApi.json("bottle_photo",{catalog,styles,lang},{images:[await prepImage(file)]});
    const items=(res&&Array.isArray(res.items)?res.items:[]).filter(x=>x&&NAME[x.id]).slice(0,20)
      .map(x=>({id:x.id,name:x.name?String(x.name).slice(0,60):null,style:STYLES[x.id]&&STYLES[x.id][x.style]?x.style:(STYLES[x.id]?Object.keys(STYLES[x.id])[0]:null)}));
    ob.busy=false;
    if(items.length)obAdd(items);
    else{ob.notice=t("ob.photoNone");renderOb()}
  }catch(e){ob.busy=false;ob.notice=sampleError(e);renderOb()}
}

/* Fill every language-dependent name and the static page text from the current locale. */
function applyLocale(){
  const root=document.documentElement;root.lang=lang;root.dir=L.dir;document.title=t("app.title");
  CATS.forEach(c=>{c.name=L.cat[c.id];c.items.forEach(it=>{it[1]=L.item[it[0]];NAME[it[0]]=it[1]})});
  GROUPS.forEach(g=>g.name=L.group[g.key]);
  Object.assign(NOTE,L.note);
  Object.entries(STYLES).forEach(([type,ss])=>Object.entries(ss).forEach(([k,st])=>st.n=L.style[type+"."+k]||""));
  TASTES.forEach(x=>{x[1]=L.taste[x[0]];TASTE_NAME[x[0]]=x[1]});
  STRENGTH.forEach(x=>x[1]=L.strength[x[0]]);
  DRINKS.forEach(d=>{const x=L.drink[d.id];d.name=x.n;d.m=x.m;d.g=x.g;d.tips=x.tips||null;d.alt=lang==="en"?"":LOCALES.en.drink[d.id].n});
  Object.entries(COUNTRIES).forEach(([k,c])=>Object.assign(c,L.country[k]));
  WOLT_AREAS.forEach(a=>a[1]=L.wolt[a[0]]);
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-t-ph]").forEach(e=>e.placeholder=t(e.dataset.tPh));
  document.querySelectorAll("[data-t-html]").forEach(e=>e.innerHTML=t(e.dataset.tHtml)); // trusted strings from src/i18n
  $("syncText").textContent=t(syncKey);
  const lb=$("langBtn");lb.textContent=t("lang.switch");lb.setAttribute("aria-label",t("lang.switchAria"));
  ["country","menuCountry","woltArea"].forEach(id=>$(id).innerHTML=""); // rebuilt with the new names
}
function setLang(next){
  lang=next;L=LOCALES[lang];try{localStorage.setItem("homebar.lang",lang)}catch(e){}
  applyLocale();setSync($("sync").classList.contains("on"),syncKey);render();
  const v=document.querySelector(".app").dataset.view;if(v==="shop")renderShop();if(v==="menu")renderMenu();
  if(!$("ob").hidden)renderOb();
  ["bottleSearch","obSearch","wineSearch"].forEach(id=>{const i=$(id);if(i&&i.value.trim())i.dispatchEvent(new Event("input"))});
  window.dispatchEvent(new Event("hb-lang")); // lets the web build repaint its account button
}

/* ---------- cloud sync (db capability) ---------- */
function applyRemote(d){
  const c=clean(d);if(!c)return;
  state=c;
  const bids=new Set(state.bottles.map(b=>"b:"+b.id)),H=have();
  mood.withs=mood.withs.filter(k=>k.startsWith("b:")?bids.has(k):k.startsWith("i:")?H.has(k.slice(2)):true);
  saveLocal();render();
  if(!barEmpty()&&!$("ob").hidden&&ob.step===0)closeOb();
}
(async()=>{
  try{
    const bar=await PLATFORM.bar();
    if(!bar){setSync(false,"sync.local");return}
    docRef=bar.ref;
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data()||{};lastRemote=payloadKey(clean(d));applyRemote(d)}
    else{
      // One-time move from the old shared document, then remove the shared copy.
      let moved=null;
      if(bar.legacy){const old=await bar.legacy.get().catch(()=>null);if(old&&old.exists){applyRemote(old.data()||{});moved=bar.legacy}}
      if(moved||!barEmpty()){
        const payload={items:state.items,custom:state.custom,bottles:state.bottles,learned:state.learned||[],updatedAt:Date.now()};
        lastRemote=payloadKey(payload);await docRef.set(payload);
        if(moved)await moved.delete().catch(()=>{});   // only after the private copy is saved
      }
    }
    setSync(true,"sync.account");
    docRef.onSnapshot(s=>{
      if(!s.exists)return;
      const d=s.data()||{},key=payloadKey(clean(d));
      if(key===lastRemote)return;
      lastRemote=key;applyRemote(d);
    });
  }catch(e){docRef=null;setSync(false,"sync.local")}
})();
})();
